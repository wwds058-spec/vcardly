# Generate the Xcode project with: brew install xcodegen && xcodegen generate
# (the .xcodeproj is generated, not committed).
name: VCardly
options:
  bundleIdPrefix: com.yasin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  VCardly:
    type: application
    platform: iOS
    sources:
      - path: VCardly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yasin.vcardly
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: VCardly/Info.plist
      properties:
        CFBundleDisplayName: VCardly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
        NSCameraUsageDescription: VCardly uses the camera only to photograph visiting cards. Photos stay on this device.
        NSFaceIDUsageDescription: VCardly uses Face ID only to unlock the app. Your biometric data never leaves the device.
        ITSAppUsesNonExemptEncryption: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.yasin.vcardly.backup
            UTTypeDescription: VCardly backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [vcbackup]
  VCardlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VCardlyTests
    dependencies:
      - target: VCardly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yasin.vcardly.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/VCardly.app/VCardly
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  VCardly:
    build:
      targets:
        VCardly: all
        VCardlyTests: [test]
    test:
      targets:
        - VCardlyTests
