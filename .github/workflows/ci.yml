name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: write   # only used to publish the debug APK to the debug-apk branch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Show lint errors
        if: failure()
        run: |
          f=$(find app/build -name 'lint-results-debug.txt' | head -1)
          echo "report: $f"
          grep -A3 " Error: " "$f" | head -150 || true

      - name: Lint summary by issue type
        if: always()
        run: |
          f=$(find app/build -name 'lint-results-debug.txt' | head -1)
          [ -n "$f" ] && grep -oE "(Error|Warning): .*\[[A-Za-z]+\]" "$f" | sed -E 's/^(Error|Warning): .*\[([A-Za-z]+)\]$/\1 \2/' | sort | uniq -c | sort -rn | head -60 || true

      - name: Print generated Room schema
        if: always()
        run: |
          for f in $(find app/schemas -name '*.json' 2>/dev/null); do echo "::SCHEMA-BEGIN $f"; cat "$f"; echo; echo "::SCHEMA-END"; done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/schemas/**
          if-no-files-found: ignore

      - name: Publish debug APK to the debug-apk branch
        if: github.event_name == 'push' && github.ref_name == 'claude/happy-goodall-tjw9vc'
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          mkdir /tmp/pub && cp "$apk" /tmp/pub/vcardly-debug.apk
          cd /tmp/pub
          sha256sum vcardly-debug.apk > vcardly-debug.apk.sha256
          printf 'Debug build of commit %s. Signed with a throw-away debug key created on the CI runner, so each build has a different signature: uninstall the old one before installing a new one. Test ad IDs only.\n' "$GITHUB_SHA" > README.txt
          git init -q -b debug-apk
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "Debug APK from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" debug-apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vcardly-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  # Runs the instrumented tests (Room DAOs, repositories) on a real emulator.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      # Screens rendered by ScreenshotTest (fictional sample data), published so the design can be reviewed.
      - name: Publish UI screenshots to the ui-screenshots branch
        if: always() && github.event_name == 'push' && github.ref_name == 'claude/happy-goodall-tjw9vc'
        run: |
          set -e
          mkdir -p /tmp/shots
          find app/build/outputs -path '*screenshots*' -name '*.png' -exec cp {} /tmp/shots/ \; || true
          ls /tmp/shots | head -100
          [ -n "$(ls -A /tmp/shots)" ] || { echo "no screenshots"; exit 0; }
          cd /tmp/shots
          printf 'UI screenshots from commit %s (emulator, API 30, Pixel 6 profile, fictional sample data).\n' "$GITHUB_SHA" > README.txt
          git init -q -b ui-screenshots
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "UI screenshots from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ui-screenshots

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/**
          if-no-files-found: ignore

  # Smaller sideload build: arm64 only, native libraries compressed. Published to its own branch.
  apk-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build arm64 debug APK
        run: ./gradlew :app:assembleDebug -Pabi=arm64-v8a --stacktrace

      - name: Publish to the debug-apk-arm64 branch
        if: github.event_name == 'push' && github.ref_name == 'claude/happy-goodall-tjw9vc'
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          mkdir /tmp/pub && cp "$apk" /tmp/pub/vcardly-debug-arm64.apk
          cd /tmp/pub
          sha256sum vcardly-debug-arm64.apk > vcardly-debug-arm64.apk.sha256
          printf 'arm64-v8a-only debug build of commit %s. Debug-signed with a throw-away key from the CI runner (uninstall older builds first). Test ad IDs only.\n' "$GITHUB_SHA" > README.txt
          git init -q -b debug-apk-arm64
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "arm64 debug APK from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" debug-apk-arm64
