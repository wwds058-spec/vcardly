name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: write   # only used to publish the debug APK to the debug-apk branch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Show lint errors
        if: failure()
        run: |
          f=$(find app/build -name 'lint-results-debug.txt' | head -1)
          echo "report: $f"
          grep -A3 " Error: " "$f" | head -150 || true

      - name: Lint summary by issue type
        if: always()
        run: |
          f=$(find app/build -name 'lint-results-debug.txt' | head -1)
          [ -n "$f" ] && grep -oE "(Error|Warning): .*\[[A-Za-z]+\]" "$f" | sed -E 's/^(Error|Warning): .*\[([A-Za-z]+)\]$/\1 \2/' | sort | uniq -c | sort -rn | head -60 || true

      - name: Print generated Room schema
        if: always()
        run: |
          for f in $(find app/schemas -name '*.json' 2>/dev/null); do echo "::SCHEMA-BEGIN $f"; cat "$f"; echo; echo "::SCHEMA-END"; done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/schemas/**
          if-no-files-found: ignore

      - name: Publish debug APK to the debug-apk branch
        if: github.event_name == 'push' && github.ref_name == 'claude/happy-goodall-tjw9vc'
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          mkdir /tmp/pub && cp "$apk" /tmp/pub/vcardly-debug.apk
          cd /tmp/pub
          sha256sum vcardly-debug.apk > vcardly-debug.apk.sha256
          printf 'Debug build of commit %s. Signed with a throw-away debug key created on the CI runner, so each build has a different signature: uninstall the old one before installing a new one. Test ad IDs only.\n' "$GITHUB_SHA" > README.txt
          git init -q -b debug-apk
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "Debug APK from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" debug-apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vcardly-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  # Runs the instrumented tests (Room DAOs, repositories) on a real emulator.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Accessibility check reports
        if: always()
        run: find app/build/outputs -path '*accessibility*' -name '*.txt' -exec sh -c 'cat "$1"' _ {} \; 2>/dev/null | sort | uniq || echo "no reports"

      # Screens rendered by ScreenshotTest (fictional sample data), published so the design can be reviewed.
      - name: Publish UI screenshots to the ui-screenshots branch
        if: always() && github.event_name == 'push' && github.ref_name == 'claude/happy-goodall-tjw9vc'
        run: |
          set -e
          mkdir -p /tmp/shots
          find app/build/outputs -path '*screenshots*' -name '*.png' -exec cp {} /tmp/shots/ \; || true
          ls /tmp/shots | head -100
          [ -n "$(ls -A /tmp/shots)" ] || { echo "no screenshots"; exit 0; }
          cd /tmp/shots
          printf 'UI screenshots from commit %s (emulator, API 30, Pixel 6 profile, fictional sample data).\n' "$GITHUB_SHA" > README.txt
          git init -q -b ui-screenshots
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "UI screenshots from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ui-screenshots

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/**
          if-no-files-found: ignore

  # Smaller sideload build: arm64 only, native libraries compressed. Published to its own branch.
  apk-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build arm64 debug APK
        run: ./gradlew :app:assembleDebug -Pabi=arm64-v8a --stacktrace

      - name: Publish to the debug-apk-arm64 branch
        if: github.event_name == 'push' && github.ref_name == 'claude/happy-goodall-tjw9vc'
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          mkdir /tmp/pub && cp "$apk" /tmp/pub/vcardly-debug-arm64.apk
          cd /tmp/pub
          sha256sum vcardly-debug-arm64.apk > vcardly-debug-arm64.apk.sha256
          printf 'arm64-v8a-only debug build of commit %s. Debug-signed with a throw-away key from the CI runner (uninstall older builds first). Test ad IDs only.\n' "$GITHUB_SHA" > README.txt
          git init -q -b debug-apk-arm64
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "arm64 debug APK from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" debug-apk-arm64

  # Native iOS app (SwiftUI): generate the project, build, run unit + screenshot tests on a simulator.
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          ios=[(k,v) for k,v in d.items() if "iOS" in k]
          ios.sort(key=lambda kv: [int(x) for x in kv[0].split("iOS-")[-1].split("-")])
          for k,v in reversed(ios):
              for pref in ("iPhone 16 Pro","iPhone 16","iPhone 15 Pro"):
                  for dev in v:
                      if dev["name"]==pref: print(dev["udid"]); sys.exit()
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator: $UDID"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test -project VCardly.xcodeproj -scheme VCardly \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee build-log.txt | grep -E "error:|warning: .*VCardly/|Test Case|Executed|BUILD|\*\*" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build-log.txt

      - name: Accessibility audit report
        if: always()
        run: cat build/accessibility-audit.txt 2>/dev/null || echo "no audit report"

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" build-log.txt | sort -u | head -80 || true

      # Backups written by the iPhone tests must pass the format's reference reader (the same rules Android enforces).
      - name: Verify iPhone backups against the reference format
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q cryptography
          /tmp/venv/bin/python ../tools/backup_reference.py verify build/backups/ios-plain.vcbackup
          /tmp/venv/bin/python ../tools/backup_reference.py verify build/backups/ios-encrypted.vcbackup "correct horse"

      # CSV, Excel and PDF files written by the iPhone tests must open with standard tools.
      - name: Verify iPhone exports open in standard tools
        run: |
          /tmp/venv/bin/pip install -q openpyxl
          /tmp/venv/bin/python ../tools/verify_exports.py build/exports

      - name: Publish iOS screenshots to the ios-screenshots branch
        if: always() && github.event_name == 'push' && github.ref_name == 'claude/happy-goodall-tjw9vc'
        run: |
          set -e
          [ -d build/screenshots ] && [ -n "$(ls -A build/screenshots)" ] || { echo "no screenshots"; exit 0; }
          cd build/screenshots
          printf 'iOS screenshots from commit %s (simulator, fictional sample data).\n' "$GITHUB_SHA" > README.txt
          git init -q -b ios-screenshots
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "iOS screenshots from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ios-screenshots

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ios/build-log.txt
            ios/build/TestResults.xcresult
          if-no-files-found: ignore
